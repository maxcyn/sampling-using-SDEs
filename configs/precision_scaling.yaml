experiment: precision_scaling
output_paths:
  raw: results/summary/precision_scaling_raw.csv
  first_budget: results/summary/precision_scaling_first_budget.csv
target:
  d: 10
  rho: 0.8
samplers: [ULA, MALA, KLMC]
step_scales:
  ULA: 0.45
  MALA: 0.75
  KLMC: 0.60
budgets: [3000, 6000, 12000, 24000]
tolerances: [0.35, 0.25, 0.18, 0.125]
tolerance_metric: cov_error
burn_fraction: 0.20
seed: 500
gamma: 2.0
max_lag: 1000
